services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - 1025:1025 # SMTP
      - 8025:8025 # Web UI
    restart: unless-stopped
    volumes:
      - ./mailpit/data:/data
      - ./mailpit/certs:/certs:ro
    environment:
      - MP_SMTP_AUTH=mailpit:mailpit
      - MP_SMTP_TLS_CERT=/certs/cert.pem
      - MP_SMTP_TLS_KEY=/certs/key.pem
      - MP_SMTP_REQUIRE_STARTTLS=true

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=America/La_Paz
      - HTTPPROXY=on
      - HTTPPROXY_USER=${GLUETUN_USER} # Optional: set HTTP proxy authentication
      - HTTPPROXY_PASSWORD=${GLUETUN_PASSWORD} # Optional: set HTTP proxy authentication
      - HTTPPROXY_STEALTH=on # Optional: enables stealth mode
      - SHADOWSOCKS=on
      # - SHADOWSOCKS_PASSWORD=${GLUETUN_PASSWORD} # Set Shadowsocks password
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES="United States"
    ports:
      - 8888:8888/tcp # HTTP proxy
      - 8388:8388/tcp # Shadowsocks
      - 8388:8388/udp # Shadowsocks
    volumes:
      - ./gluetun:/gluetun
    restart: unless-stopped