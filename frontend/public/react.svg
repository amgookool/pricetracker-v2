<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" rx="40" fill="#1E1E1E"/>
  
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007ACC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4FC1FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g filter="url(#glow)">
    <path d="M120 150 H140 L160 260 H260 L280 180 H155" fill="none" stroke="url(#blueGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="180" cy="290" r="10" fill="#4FC1FF"/>
    <circle cx="240" cy="290" r="10" fill="#4FC1FF"/>
    <polyline points="150,220 190,180 230,200 280,130" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="260,130 280,130 280,150" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="200" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="bold" fill="#D4D4D4" text-anchor="middle">
    Price<tspan fill="#007ACC">Pulse</tspan>
  </text>
</svg>